<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pongstorm</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>

<div id="overlay">
  <div id="card">
    <h1>Pongstorm</h1>
    <p class="sub">Dusk court. Superpowers. Multiple balls. First to 7.</p>

    <div class="row">
      <button class="primary" id="hostBtn">Create Room</button>
    </div>

    <div id="linkRow">
      <label>Share this link</label>
      <div id="linkBox">
        <input type="text" id="linkInput" readonly>
        <button id="copyBtn">Copy</button>
      </div>
    </div>

    <div id="status">Waiting...</div>
  </div>
</div>

<div id="gameWrap">
  <div id="shareBar">
    <span class="shareLabel">Invite</span>
    <input type="text" id="shareLinkInput" readonly>
    <button type="button" id="shareCopyBtn">Copy link</button>
  </div>
  <div id="hud">
    <span class="you">■ HOST</span> left &nbsp;|&nbsp;
    <span class="peer">■ JOIN</span> right &nbsp;|&nbsp;
    WASD / Arrows move · Space / J smash &nbsp;|&nbsp;
    peers: <span id="peerCount">0</span>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="endBar">
    <button type="button" id="rematchBtn">Play again</button>
    <span id="endNote"></span>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
